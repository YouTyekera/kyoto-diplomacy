# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: kyoto-diplomacy-server
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: kyoto-diplomacy-web
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_PUBLIC_DEPLOYMENT
        value: 'true'
      - key: VITE_ONLINE_SERVER_URL
        sync: false
